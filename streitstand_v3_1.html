<style>
  /* Layout: Aktenliste links · Streitstand Mitte · Originaldokument rechts (immer als Seitenpanel) */
  :root {
    --bg: #f4f6fa; --paper: #ffffff; --raise: #fbfcfe; --ink: #0f172a; --muted: #64748b; --faint: #94a3b8;
    --line: #e4e8ef; --line-soft: #eef1f5; --hover: #f3f6fb; --well: #eef1f6;
    --accent: #2f5bea; --accent-ink: #ffffff; --accent-soft: #eef2ff; --accent-line: #c9d4fd; --accent-strong: #1e3fae;
    --side: #ffffff; --overlay: rgba(15, 23, 42, .38);
    --green: #15803d; --green-bg: #e8f6ee; --red: #c0262d; --red-bg: #fdeced; --orange: #c2410c; --orange-bg: #fff1e8;
    --amber: #a16207; --amber-bg: #fef6dc; --amber-line: #f3dc9b; --law: #4f46e5; --law-bg: #eef0ff; --gray-bg: #eff2f6;
    --hl-bg: #fff8db; --hl-line: #f2d675; --mark: rgba(255, 200, 0, 0.5);
    --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 6px 20px rgba(15, 23, 42, .05);
    --shadow-lg: 0 12px 40px rgba(15, 23, 42, .16);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #0b1017; --paper: #121923; --raise: #151d28; --ink: #e6ebf2; --muted: #94a3b8; --faint: #64748b;
    --line: #222d3b; --line-soft: #1a2330; --hover: #18212d; --well: #0d131b;
    --accent: #7b96ff; --accent-ink: #0b1017; --accent-soft: #19213b; --accent-line: #2e3b6b; --accent-strong: #aebdff;
    --side: #0f151e; --overlay: rgba(0, 0, 0, .55);
    --green: #5fd08f; --green-bg: #12281b; --red: #f48a86; --red-bg: #33181a; --orange: #f5a26a; --orange-bg: #33200f;
    --amber: #e8bd5f; --amber-bg: #2e240e; --amber-line: #5a4716; --law: #a5a6ff; --law-bg: #1d1f45; --gray-bg: #1c2532;
    --hl-bg: #332b10; --hl-line: #6e5a1c; --mark: rgba(255, 196, 0, 0.42);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 12px 40px rgba(0, 0, 0, .5);
    color-scheme: dark; } }
  :root[data-theme="dark"] {
    --bg: #0b1017; --paper: #121923; --raise: #151d28; --ink: #e6ebf2; --muted: #94a3b8; --faint: #64748b;
    --line: #222d3b; --line-soft: #1a2330; --hover: #18212d; --well: #0d131b;
    --accent: #7b96ff; --accent-ink: #0b1017; --accent-soft: #19213b; --accent-line: #2e3b6b; --accent-strong: #aebdff;
    --side: #0f151e; --overlay: rgba(0, 0, 0, .55);
    --green: #5fd08f; --green-bg: #12281b; --red: #f48a86; --red-bg: #33181a; --orange: #f5a26a; --orange-bg: #33200f;
    --amber: #e8bd5f; --amber-bg: #2e240e; --amber-line: #5a4716; --law: #a5a6ff; --law-bg: #1d1f45; --gray-bg: #1c2532;
    --hl-bg: #332b10; --hl-line: #6e5a1c; --mark: rgba(255, 196, 0, 0.42);
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 12px 40px rgba(0, 0, 0, .5);
    color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { font-family: Inter, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-size: 14px; line-height: 1.45; color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased; font-feature-settings: "cv11", "ss01"; }
  button { font: inherit; cursor: pointer; color: inherit; }
  input, select, textarea { font: inherit; color: var(--ink); }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
  .app { display: grid; grid-template-columns: 264px minmax(0, 1fr); height: 100%; transition: grid-template-columns .2s ease; }
  .app.with-preview { grid-template-columns: 0 minmax(0, 1fr) min(max(44vw, 380px), 760px); }
  .app.with-preview aside.side { overflow: hidden; border-right: 0; }

  /* Sidebar */
  aside.side { background: var(--side); border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .brand { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 20px 14px 14px; }
  .logo { width: 32px; height: 32px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--law)); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 16px; flex: none; }
  .brand b { display: block; font-size: 19px; letter-spacing: -.015em; line-height: 1.25; white-space: nowrap; }
  .brand span { display: block; font-size: 12px; color: var(--muted); }
  .ver { font-size: 10.5px; font-weight: 700; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 1px 5px; margin-left: 4px; vertical-align: 1px; }
  .side .new-btn { margin: 4px 14px 10px; padding: 9px 12px; border: 1px dashed var(--accent-line); border-radius: 10px; background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .side .new-btn:hover { border-style: solid; }
  .side-label { padding: 8px 18px 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
  .new-form { margin: 0 14px 12px; padding: 12px; background: var(--raise); border: 1px solid var(--line); border-radius: 12px; display: grid; gap: 10px; }
  .new-form label { display: block; font-size: 11.5px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
  .new-form input, .new-form select { width: 100%; padding: 7px 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); }
  .new-form .row2 { display: flex; gap: 6px; }
  .btn-ghost { padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); font-size: 13px; }
  .btn-ghost:hover { background: var(--hover); }
  .btn-primary { padding: 8px 12px; border-radius: 8px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; }
  .folder-name { font-size: 12px; color: var(--muted); margin-top: 5px; word-break: break-all; }
  .akten { flex: 1; overflow: auto; padding: 0 10px 12px; }
  .akte-item { display: block; width: 100%; text-align: left; padding: 10px 12px; margin: 2px 0; border-radius: 10px; border: 1px solid transparent; background: transparent; }
  .akte-item:hover { background: var(--hover); }
  .akte-item.active { background: var(--accent-soft); border-color: var(--accent-line); }
  .akte-item .az { font-size: 11.5px; color: var(--muted); }
  .akte-item.active .az { color: var(--accent-strong); }
  .akte-item .parties { font-weight: 600; font-size: 13.5px; margin-top: 1px; }
  .akte-item .meta { font-size: 11.5px; color: var(--faint); margin-top: 4px; display: flex; gap: 10px; }
  .side-foot { padding: 12px 14px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .side-foot button { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; font-size: 12.5px; }
  .side-foot button:hover { background: var(--hover); }
  .dot-ok { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--green); margin-right: 6px; vertical-align: 1px; }

  /* Main */
  main.main { min-width: 0; display: flex; flex-direction: column; min-height: 0; }
  .topbar { padding: 20px 28px 0; display: flex; align-items: flex-start; gap: 16px; flex-wrap: wrap; }
  .rubrum { min-width: 0; flex: 1 1 280px; }
  .rubrum .az-chip { display: inline-block; font-size: 11.5px; color: var(--muted); background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; }
  .rubrum h1 { margin: 6px 0 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.25; }
  .rubrum h1 .vs { color: var(--faint); font-weight: 500; margin: 0 6px; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .tb { padding: 7px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--paper); font-size: 13px; font-weight: 500; box-shadow: 0 1px 1px rgba(15,23,42,.03); display: inline-flex; align-items: center; gap: 6px; }
  .tb:hover { background: var(--hover); }
  .tb.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .tb.primary:hover { filter: brightness(1.06); background: var(--accent); }
  .tb.danger { color: var(--red); }
  .tb.icon { padding: 7px 9px; }
  .tb:disabled { opacity: .45; cursor: default; }
  .show-side { display: none; }
  .app.with-preview .show-side { display: inline-flex; }
  .more { position: relative; }
  .menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 20; background: var(--paper); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-lg); padding: 6px; min-width: 210px; }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
  .menu button:hover:not(:disabled) { background: var(--hover); }
  .menu button:disabled { opacity: .45; cursor: default; }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 5px 4px; }
  .filters { display: inline-flex; gap: 2px; padding: 3px; margin: 16px 28px 0; background: var(--gray-bg); border-radius: 10px; align-self: flex-start; flex-wrap: wrap; }
  .chip-f { padding: 5px 12px; border-radius: 8px; border: 0; background: transparent; font-size: 12.5px; font-weight: 500; color: var(--muted); }
  .chip-f.on { background: var(--paper); color: var(--ink); box-shadow: 0 1px 2px rgba(15,23,42,.08); }
  .chip-f .n { color: var(--faint); margin-left: 4px; font-weight: 500; }
  .view-row { display: flex; flex-wrap: wrap; align-items: flex-start; margin-right: 28px; }
  .view-row .view-seg { margin-left: auto; }
  @media (max-width: 860px) { .view-row { margin-right: 16px; } .view-row .view-seg { margin-left: 16px; } }
  .content { flex: 1; overflow: auto; padding: 16px 28px 48px; }
  .banner { padding: 10px 14px; border-radius: 10px; margin-bottom: 12px; font-size: 13px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .banner.info { background: var(--accent-soft); border: 1px solid var(--accent-line); color: var(--accent-strong); }
  .banner.warn { background: var(--amber-bg); border: 1px solid var(--amber-line); color: var(--amber); }
  .banner.err { background: var(--red-bg); border: 1px solid var(--red-bg); color: var(--red); }
  .spin { width: 16px; height: 16px; border: 2px solid var(--accent-line); border-top-color: var(--accent); border-radius: 50%; animation: sp 0.8s linear infinite; flex: none; }
  @keyframes sp { to { transform: rotate(360deg); } }

  .empty { max-width: 560px; margin: 8vh auto; text-align: center; color: var(--muted); }
  .empty .logo { width: 52px; height: 52px; border-radius: 14px; font-size: 24px; margin: 0 auto 16px; }
  .logo-mark { width: 112px; height: 112px; flex: none; display: block; overflow: visible; }
  .empty .logo-mark { width: 176px; height: 176px; margin: 0 auto 18px; }
  .empty h2 { color: var(--ink); font-size: 22px; letter-spacing: -.02em; margin: 0 0 8px; }
  .steps { text-align: left; display: grid; gap: 8px; margin: 22px 0; }
  .steps div { display: flex; gap: 10px; align-items: center; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink); }
  .steps i { font-style: normal; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft); color: var(--accent-strong); display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
  .small { font-size: 12px; color: var(--muted); }

  /* Streitstand-Tabelle */
  .card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); }
  /* Kein seitliches Scrollen: Tabelle passt sich der Breite an, bei wenig Platz (z. B. offene Vorschau) als Karten */
  .table-wrap { container-type: inline-size; }
  table.st { width: 100%; border-collapse: separate; border-spacing: 0; }
  table.st td { overflow-wrap: break-word; hyphens: auto; }
  table.st th { position: sticky; top: 0; z-index: 2; background: var(--paper); text-align: left; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 12px 14px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.st th:first-child { border-top-left-radius: 14px; }
  table.st th:last-child { border-top-right-radius: 14px; }
  table.st td { vertical-align: top; padding: 14px; font-size: 13.5px; border-bottom: 1px solid var(--line-soft); }
  table.st tbody tr:not(.group):hover td { background: var(--raise); }
  table.st tbody tr:last-child td { border-bottom: 0; }
  tr.group td { padding: 18px 14px 8px; border-bottom: 1px solid var(--line-soft); font-size: 11.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--accent-strong); background: var(--paper); }
  tr.group td .cnt { color: var(--faint); font-weight: 600; margin-left: 6px; }
  td.merk { width: 18%; min-width: 160px; }
  td.merk .lbl { font-weight: 600; letter-spacing: -.005em; }
  td.merk .inst { display: inline-block; margin-top: 5px; font-size: 12px; color: var(--accent-strong); background: var(--accent-soft); border-radius: 6px; padding: 1px 7px; }
  td.merk .norm { color: var(--faint); font-size: 12px; margin-top: 4px; }
  td.side { width: 22%; }
  table.st tr.folded td { padding-top: 9px; padding-bottom: 9px; color: var(--muted); }
  table.st tr.folded td.merk .lbl { font-weight: 500; }
  table.st td.fold .court { margin-left: 10px; }
  .fold-bar { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; color: var(--muted); }
  .fold-bar .note-btn { white-space: nowrap; }
  /* Minderungsschätzung je Mangel */
  .min-mini { margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .min-chip { display: inline-block; border: 0; border-radius: 999px; padding: 2px 9px; font-size: 11.5px; font-weight: 600; line-height: 1.5; cursor: pointer; background: var(--gray-bg); color: var(--muted); }
  span.min-chip { cursor: default; }
  .min-chip span { font-weight: 500; opacity: .85; }
  .min-chip.p-hoch { background: var(--green-bg); color: var(--green); }
  .min-chip.p-mittel { background: var(--amber-bg); color: var(--amber); }
  .min-box { margin: 4px 0 14px; padding: 10px 12px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--raise); font-size: 13px; }
  .min-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 6px; }
  .min-val { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px 12px; }
  .min-big { font-size: 22px; font-weight: 700; letter-spacing: -.01em; }
  .min-range { color: var(--muted); font-weight: 500; }
  .min-bar { position: relative; height: 6px; margin: 8px 0 10px; border-radius: 3px; background: var(--well); }
  .min-bar i { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--accent-line); }
  .min-bar b { position: absolute; top: -3px; width: 3px; height: 12px; margin-left: -1px; border-radius: 2px; background: var(--accent); }
  .min-list { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
  .min-list li { display: flex; align-items: center; gap: 6px; }
  .min-list li a { flex: none; font-size: 12px; text-decoration: none; color: var(--law); }
  .min-busy { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  .min-err { margin-top: 6px; font-size: 12px; color: var(--red); }
  .min-note { margin-top: 8px; font-size: 11.5px; color: var(--faint); }
  .item { margin-bottom: 6px; }
  .item:last-child { margin-bottom: 0; }
  .say { display: block; width: 100%; text-align: left; border: 1px solid transparent; background: transparent; padding: 5px 8px; margin: -5px -8px; border-radius: 8px; line-height: 1.45; transition: background .12s; }
  .say:hover { background: var(--accent-soft); }
  .say.active { background: var(--hl-bg); border-color: var(--hl-line); }
  .anc { display: inline-block; font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; font-size: 10.5px; color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 0 5px; margin-left: 5px; white-space: nowrap; vertical-align: 1px; }
  .anc.fixed { color: var(--amber); background: var(--amber-bg); }
  .new-tag { display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: .04em; color: #fff; background: var(--accent); border-radius: 4px; padding: 0 5px; margin-left: 5px; vertical-align: 1px; }
  .none { color: var(--faint); font-size: 13px; }
  td.status { width: 1%; white-space: nowrap; }
  .st-badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; line-height: 1.4; cursor: default; }
  .st-badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .s-unstreitig, .s-nicht_bestritten { background: var(--green-bg); color: var(--green); }
  .s-bestritten { background: var(--red-bg); color: var(--red); }
  .s-nichtwissen { background: var(--orange-bg); color: var(--orange); }
  .s-pauschal { background: var(--amber-bg); color: var(--amber); }
  .s-rechtsfrage { background: var(--law-bg); color: var(--law); }
  .s-nicht_vorgetragen, .s-offen { background: var(--gray-bg); color: var(--muted); }
  td.last { width: 1%; white-space: nowrap; }
  .last-who { font-weight: 500; cursor: default; }
  .last-who.muted { color: var(--faint); }
  td.proof { width: 30%; }
  .proof-item { display: flex; gap: 6px; align-items: flex-start; }
  .proof-item + .proof-item { margin-top: 6px; }
  .proof-item .who { flex: none; font-size: 10.5px; font-weight: 600; color: var(--faint); width: 30px; padding-top: 3px; }
  .proof-item .item { flex: 1; min-width: 0; }
  .pm { display: inline-block; font-size: 10.5px; font-weight: 600; color: var(--muted); background: var(--gray-bg); border-radius: 5px; padding: 0 6px; margin-right: 5px; vertical-align: 1px; }
  .gap { display: inline-flex; align-items: center; gap: 5px; margin-top: 8px; font-size: 11.5px; color: var(--red); background: var(--red-bg); border-radius: 6px; padding: 2px 8px; font-weight: 600; }
  .flag { display: inline-block; font-size: 9.5px; font-weight: 700; letter-spacing: .04em; border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: 2px; }
  .flag.neu { background: var(--accent); color: #fff; }
  .flag.geaendert { background: var(--law); color: #fff; }

  /* Parteifarben: Kläger blau, Beklagter orange – in Tabelle, Karten und Beweisangeboten */
  table.st th.th-kl { color: var(--accent); }
  table.st th.th-bk { color: var(--orange); }
  table.st td.side.kl { box-shadow: inset 3px 0 0 var(--accent-line); }
  table.st td.side.bk { box-shadow: inset 3px 0 0 var(--orange-bg); }
  .proof-item .who.kl { color: var(--accent); }
  .proof-item .who.bk { color: var(--orange); }
  /* Kartenansicht bei wenig Platz (z. B. offene Vorschau) */
  @container (max-width: 760px) {
    table.st thead { display: none; }
    table.st, table.st tbody { display: block; }
    table.st tbody tr:not(.group) {
      display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 10px; row-gap: 8px;
      grid-template-areas: "merk merk" "status last" "kl bk" "proof proof";
      padding: 14px 16px 16px; border-bottom: 1px solid var(--line);
    }
    table.st tbody tr:not(.group):hover td { background: transparent; }
    table.st tbody tr:last-child { border-bottom: 0; }
    table.st tr.group { display: block; }
    table.st tr.group td { display: block; padding: 16px 16px 6px; }
    table.st td { display: block; width: auto; border-bottom: 0; padding: 0; }
    table.st td.merk { grid-area: merk; }
    table.st td.status { grid-area: status; white-space: normal; }
    table.st td.last { grid-area: last; white-space: normal; }
    table.st td.status::before, table.st td.last::before { content: attr(data-label) ":"; font-size: 11px; font-weight: 600; color: var(--muted); margin-right: 6px; }
    table.st td.side { border-radius: 10px; padding: 10px 12px 12px; box-shadow: none; }
    table.st td.side.kl { grid-area: kl; background: var(--accent-soft); border-left: 3px solid var(--accent); }
    table.st td.side.bk { grid-area: bk; background: var(--orange-bg); border-left: 3px solid var(--orange); }
    table.st td.side::before { content: attr(data-label); display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
    table.st td.side.kl::before { color: var(--accent); }
    table.st td.side.bk::before { color: var(--orange); }
    table.st td.side .say:hover { background: var(--paper); }
    table.st td.proof { grid-area: proof; padding-top: 4px; }
    table.st td.proof::before { content: attr(data-label); display: block; font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
    table.st tbody tr.folded { grid-template-areas: "merk merk" "status last" "fold fold"; padding: 10px 16px; }
    table.st tr.folded td.fold { grid-area: fold; }
    table.st tr.folded td.proof { display: none; }
  }
  @container (max-width: 480px) {
    table.st tbody tr:not(.group) { grid-template-columns: minmax(0, 1fr); grid-template-areas: "merk" "status" "last" "kl" "bk" "proof"; }
    table.st tbody tr.folded { grid-template-areas: "merk" "status" "last" "fold"; }
  }

const DB = {
  db: null,
  mem: { akten: new Map(), ocr: new Map(), files: new Map() },
  open() {
    return new Promise(res => {
      try {
        const r = indexedDB.open('team9-streitstand', 2);
        r.onupgradeneeded = () => { const d = r.result; ['ocr', 'files'].forEach(n => { if (!d.objectStoreNames.contains(n)) d.createObjectStore(n); }); if (!d.objectStoreNames.contains('akten')) d.createObjectStore('akten', { keyPath: 'id' }); };
        r.onsuccess = () => { this.db = r.result; res(); };
        r.onerror = () => res();
      } catch { res(); }
    });
  },
  tx(store, mode, fn) {
    if (!this.db) { // Ohne Browser-Speicher: nur im Arbeitsspeicher
      const m = this.mem[store], s = { getAll: () => ({ result: [...m.values()] }), get: k => ({ result: m.get(k) }), put: (v, k) => { m.set(k ?? v.id, v); return {}; }, delete: k => { m.delete(k); return {}; } };
      const out = fn(s); return Promise.resolve(out && out.result);
    }
    return new Promise((res, rej) => {
      const t = this.db.transaction(store, mode); const s = t.objectStore(store);
      const out = fn(s); t.oncomplete = () => res(out && out.result); t.onerror = () => rej(t.error);
    });
  },

// Vergleich nur über Buchstaben/Ziffern: robust gegen Zeilenumbrüche, Silbentrennung, Anführungszeichen.
function normChar(ch) {
  const l = ch.toLowerCase();
  return /[a-z0-9äöüß]/.test(l) ? l : '';
}
function buildIndex(segments) {
  const chars = [], map = [];
  segments.forEach((seg, si) => {
    const t = (seg.text || '').normalize('NFC');
    for (let i = 0; i < t.length; i++) { const c = normChar(t[i]); if (c) { chars.push(c); map.push([si, i]); } }

}
function normQuote(q) { return [...String(q || '').normalize('NFC')].map(normChar).join(''); }
function rangesFrom(idx, a, b) {
  const per = new Map();
  for (let k = a; k < b; k++) {
    const [si, i] = idx.map[k];
    const r = per.get(si); if (r) { r.end = i + 1; } else per.set(si, { si, start: i, end: i + 1 });
  }
  return [...per.values()];
}
// Liefert {exact, ranges:[{si,start,end}], firstSeg} oder null
function findQuote(segments, quote, fuzzy = false) {
  const idx = buildIndex(segments);
  const parts = String(quote || '').split(/\.\.\.|…|\[\.\.\.\]/).map(normQuote).filter(p => p.length >= 4);
  if (!parts.length || parts.reduce((n, p) => n + p.length, 0) < 10) return null;
  let pos = 0, ranges = [], ok = true;
  for (const p of parts) {
    const at = idx.str.indexOf(p, pos);
    if (at < 0) { ok = false; break; }
    ranges = ranges.concat(rangesFrom(idx, at, at + p.length)); pos = at + p.length;
  }
  if (ok) return { exact: true, ranges, firstSeg: ranges[0].si };
  if (!fuzzy) return null;
  const q = parts.join('');
  for (const k of [0.75, 0.6, 0.45]) {
    const n = Math.max(10, Math.floor(q.length * k));
    let at = idx.str.indexOf(q.slice(0, n));
    if (at >= 0) { const r = rangesFrom(idx, at, Math.min(idx.str.length, at + q.length)); return { exact: false, ranges: r, firstSeg: r[0].si }; }
    at = idx.str.indexOf(q.slice(q.length - n));
    if (at >= 0) { const s = Math.max(0, at + n - q.length); const r = rangesFrom(idx, s, at + n); return { exact: false, ranges: r, firstSeg: r[0].si }; }
  }
  return null;
}

const ID_RE = /(?:^|[^A-Za-z0-9])([A-Z]{1,2}\d{2})(?=[^A-Za-z0-9]|$)/;
function fmtOf(name) {
  const e = name.toLowerCase().split('.').pop();
  if (['md', 'markdown', 'txt', 'eml', 'csv'].includes(e)) return 'md';
  if (e === 'pdf') return 'pdf';
  if (['png', 'jpg', 'jpeg', 'webp', 'gif', 'bmp'].includes(e)) return 'img';

}
const isZip = n => /\.zip$/i.test(n);
// ZIP-Archive werden im Browser entpackt; ihre Dateien zählen wie die eines Unterordners
async function unzipEntries(file, prefix, ignored) {
  if (!window.JSZip) throw new Error('ZIP-Dateien können nicht entpackt werden (Bibliothek nicht geladen – Internetverbindung prüfen).');
  const zip = await JSZip.loadAsync(file), out = [];
  for (const z of Object.values(zip.files)) {
    const name = z.name.split('/').pop();
    if (z.dir || !name || name.startsWith('.') || z.name.startsWith('__MACOSX/')) continue;
    const p = prefix + '/' + z.name;
    if (isZip(name)) out.push(...await unzipEntries(new File([await z.async('blob')], name), p.replace(/\.zip$/i, ''), ignored));
    else if (fmtOf(name)) out.push({ path: p, file: new File([await z.async('blob')], name, { lastModified: z.date ? z.date.getTime() : 1 }) });
    else if (ignored) ignored.push(p);
  }
  return out;
}
async function walkHandle(dir, prefix = '') {
  const out = [];
  for await (const [name, h] of dir.entries()) {
    if (name.startsWith('.')) continue;
    const p = prefix + name;
    if (h.kind === 'directory') out.push(...await walkHandle(h, p + '/'));
    else if (fmtOf(name)) out.push({ path: p, file: await h.getFile() });
    else if (isZip(name)) out.push(...await unzipEntries(await h.getFile(), p.replace(/\.zip$/i, '')));
  }
  return out;
}
function parseMd(text) {
  const fm = {}; let body = text;
  const m = text.match(/^---\s*\n([\s\S]*?)\n---\s*\n?/);
  if (m) { m[1].split('\n').forEach(l => { const i = l.indexOf(':'); if (i > 0) fm[l.slice(0, i).trim()] = l.slice(i + 1).trim(); }); body = text.slice(m[0].length); }
  let title = ''; const lines = [];
  body.split('\n').forEach(raw => {
    const l = raw.trim(); if (!l) return;
    if (!title && l.startsWith('#')) { title = l.replace(/^#+\s*/, ''); return; }
    const a = l.match(/^\[([A-Z]{1,2}\d{2}:L\d+)\]\s*(.*)$/);
    lines.push(a ? { anchor: a[1], text: a[2] } : { anchor: null, text: l.replace(/^#+\s*/, '') });

  return { fm, title, lines };
}
// Lesbarer Titel aus dem Dateinamen: "01_Klageschrift_2026-10-12.pdf" -> "Klageschrift 2026-10-12"
function cleanName(path, id) {
  let n = path.split('/').pop().replace(/\.[^.]+$/, '');
  if (id) n = n.replace(new RegExp('^(.*?[^A-Za-z0-9])?' + id + '(?=[^A-Za-z0-9]|$)'), '');
  return n.replace(/^[\d\s._-]+(?=[A-Za-zÄÖÜäöü])/, '').replace(/[_]+/g, ' ').replace(/\s+/g, ' ').trim() || path.split('/').pop();

// Dateiname ohne Kennung und Nummernpräfix ("eingang_02_M03.pdf" -> "", "K03_Foto_1.png" -> "foto 1")
function restName(path, id) {
  const base = path.split('/').pop(), c = cleanName(path, id);
  return c === base ? '' : c.toLowerCase();
}
async function buildDocs(entries) {
  entries.sort((a, b) => a.path.localeCompare(b.path));
  const docs = new Map(), unnamed = new Map();
  for (const e of entries) {
    const format = fmtOf(e.path);
    let id = null, md = null;
    if (format === 'md') {
      md = parseMd(await e.file.text());
      id = md.fm.document_id || null;
    }
    if (!id) { const m = e.path.split('/').pop().match(ID_RE); id = m ? m[1] : null; }
    if (!id) { const k = e.path.replace(/\.[^.]+$/, ''); if (!unnamed.has(k)) unnamed.set(k, []); unnamed.get(k).push({ e, format, md }); continue; }
    // Gleiche Kennung = gleiches Dokument nur, wenn der Rest des Dateinamens passt (leer oder gleich).
    // Sonst eigenes Dokument (K03, K03-2 …), damit z. B. "K03_Foto_1.png" und "K03_Foto_2.png" beide gelesen werden.
    const rest = restName(e.path, id);
    const fits = d => {
      const same = x => { const r = restName(x.path, id); return !r || !rest || r === rest; };
      const v = d.variants[format]; return v ? same(v) : Object.values(d.variants).every(same);
    };
    let docId = id, k = 1, d = docs.get(id);
    while (d && !fits(d)) { docId = id + '-' + (++k); d = docs.get(docId); }
    if (!d) { d = { id: docId, title: '', date: '', release: '', variants: {} }; docs.set(docId, d); }
    if (d.variants[format]) continue; // echte Dublette (z. B. 05_RELEASES, 04_MIXED_INPUT) – erste Fassung gewinnt
    d.variants[format] = { path: e.path, file: e.file, sig: e.path + '|' + e.file.size + '|' + e.file.lastModified };
    if (md) {
      d.md = md;
      d.title = d.title || md.title.replace(/^[A-Z]{1,2}\d{2}\s*\|\s*/, '');
      d.date = d.date || md.fm.document_date || '';
      d.release = d.release || md.fm.release || '';

  }

  let n = 1;

    let id; do { id = 'S' + String(n++).padStart(2, '0'); } while (docs.has(id));
    const d = { id, title: '', date: '', release: '', variants: {}, autoId: true };
    for (const { e, format, md } of list) {
      if (d.variants[format]) continue;
      d.variants[format] = { path: e.path, file: e.file, sig: e.path + '|' + e.file.size + '|' + e.file.lastModified };
      if (md) { d.md = md; d.title = md.title; d.date = md.fm.document_date || ''; }

  return new Map([...docs.entries()].sort((a, b) => a[0].localeCompare(b[0], 'de', { numeric: true })));
}

if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = PDF_WORKER;
const pdfCache = new Map();
async function openPdf(variant) {

    const buf = new Uint8Array(await variant.file.arrayBuffer());
    pdfCache.set(variant.sig, pdfjsLib.getDocument({ data: buf }).promise);
  }

}
async function pdfPageTexts(variant) {
  const pdf = await openPdf(variant); const pages = [];
  for (let p = 1; p <= pdf.numPages; p++) {
    const tc = await (await pdf.getPage(p)).getTextContent();

    pages.push(s);

let ocrWorker = null;
async function ocr(source, cacheKey) {
  if (cacheKey) { const c = await DB.ocrGet(cacheKey); if (c) return c; }
  if (!ocrWorker) {
    // Sprachdaten liegen als Base64-Text neben der Seite (Artefakte liefern keine .gz-Dateien aus).
    // In der lokal geöffneten Datei (file://) darf der Browser sie nicht laden – dann holt Tesseract sie selbst aus dem Netz.
    let b64 = null;
    try { const r = await fetch(new URL('lang/deu.traineddata.gz.b64.txt', document.baseURI)); if (r.ok) b64 = await r.text(); } catch {}
    if (b64) {
      const bin = atob(b64.trim()), data = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) data[i] = bin.charCodeAt(i);
      // in den Sprachdaten-Speicher der Texterkennung legen; sie liest von dort statt aus dem Netz
      await new Promise(res => {
        try {
          const r = indexedDB.open('keyval-store', 1);
          r.onupgradeneeded = () => r.result.createObjectStore('keyval');
          r.onsuccess = () => { const tx = r.result.transaction('keyval', 'readwrite'); tx.objectStore('keyval').put(data, './deu.traineddata'); tx.oncomplete = res; tx.onerror = res; };
          r.onerror = res;
        } catch { res(); }
      });
    }
    ocrWorker = await Tesseract.createWorker('deu');
  }
  const { data } = await ocrWorker.recognize(source);
  const res = { words: data.words.map(w => ({ text: w.text, b: [w.bbox.x0, w.bbox.y0, w.bbox.x1, w.bbox.y1] })), text: data.text };
  if (cacheKey) await DB.ocrPut(cacheKey, res);

}
async function renderPdfPageToCanvas(pdf, p, scale) {
  const page = await pdf.getPage(p); const vp = page.getViewport({ scale });
  const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
  await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
  return { canvas: c, viewport: vp, page };
}

// Beste Textquelle eines Dokuments für die Analyse: MD > PDF-Text > OCR
async function analysisText(d, progress) {
  if (d.md) return { source: 'md', lines: d.md.lines.map((l, i) => ({ anchor: l.anchor, text: l.text, n: i })) };
  if (d.variants.pdf) {
    const pdf = await openPdf(d.variants.pdf), pages = await pdfPageTexts(d.variants.pdf), lines = [];
    let ocrPages = 0;
    for (let p = 1; p <= pages.length; p++) {
      let t = pages[p - 1];
      if (t.replace(/\s/g, '').length < 25) { // Seite ohne Textebene (Scan) -> Texterkennung
        progress && progress(`Texterkennung ${d.id}, Seite ${p} …`);
        const { canvas } = await renderPdfPageToCanvas(pdf, p, 2);
        t = (await ocr(canvas, 'pdf|' + d.variants.pdf.sig + '|' + p)).text; ocrPages++;
      }
      t.split('\n').map(s => s.trim()).filter(Boolean).forEach(s => lines.push({ anchor: null, page: p, text: s }));
    }
    return { source: ocrPages === pages.length ? 'ocr' : ocrPages ? 'pdf+ocr' : 'pdf', lines };
  }

    progress && progress(`Texterkennung ${d.id} (Bild) …`);
    const r = await ocr(d.variants.img.file, 'img|' + d.variants.img.sig);
    return { source: 'ocr', lines: r.text.split('\n').map(s => s.trim()).filter(Boolean).map(s => ({ anchor: null, text: s })) };

const textCache = new Map(); // sig -> {source, lines}

function readState(d) { const t = textCache.get(docSig(d)); return t || null; }
let readRun = null;
function readAllDocs() {

// Schlüssel bereinigen: ganze .env-Zeile, Anführungszeichen, Leerzeichen/Zeilenumbrüche (z. B. aus PDF kopiert)
function cleanKey(raw) {

async function callOpenRouter(model, prompt, keyOverride) {
  const key = cleanKey(keyOverride || lsGet('t9_key'));
  if (!key) throw Object.assign(new Error('Kein OpenRouter-Schlüssel hinterlegt (Einstellungen).'), { code: 'auth' });
  let r;

    r = await fetch('https://openrouter.ai/api/v1/chat/completions', {
      method: 'POST',
      headers: { 'Authorization': 'Bearer ' + key, 'Content-Type': 'application/json', 'X-Title': 'BGH Pro Max' },
      // Ohne "reasoning: enabled false" verbraucht Haiku das Token-Limit mit Nachdenken und liefert leeren Text
      body: JSON.stringify({ model, temperature: 0, max_tokens: 16000, reasoning: { enabled: false }, messages: [{ role: 'system', content: SYSTEM_PROMPT }, { role: 'user', content: prompt }] })

// Anker-Wächter: jedes Zitat muss im genannten (oder einem anderen) Dokument wörtlich vorkommen
function verifyItem(item, docTexts, ctx, discarded) {

    const x = docTexts.find(z => z.d.id === id); if (!x) return null;
    const segs = x.at.lines.map(l => ({ text: l.text }));
    const hit = findQuote(segs, item.zitat); if (!hit) return null;
    const ln = x.at.lines[hit.firstSeg];

async function pool(tasks, n) {

}
async function ask(prompt) {

// Datenbestand ist noch klein: bei < 3 Treffern automatisch mit Einzelbegriffen (+ „Miete“) erweitern (ergänzt res)
async function widenRsp(res, queries, court, fresh) {
  if (res.hits.length >= 3) return res;
  const words = [...new Set(queries.flatMap(q => q.replace(/"/g, '').split(/\s+/)).filter(w => w.length >= 5 && !/^(miete|mieter|mietminderung|vermieter)$/i.test(w)))].slice(0, 4);
  const wide = words.map(w => w + ' Miete').filter(w => !queries.includes(w));
  if (!wide.length) return res;
  try {
    const more = await risMulti(wide, court, fresh);
    const have = new Set(res.hits.map(h => h.nr));
    more.hits.filter(h => !have.has(h.nr)).forEach(h => res.hits.push({ ...h, erweitert: true }));
    res.perQuery.push(...more.perQuery.map(x => ({ ...x, erweitert: true })));
  } catch (e) { /* Erweiterung ist optional */ }
  return res;
}
async function runRsp(fresh) {
  const p = S.preview; if (!p || p.kind !== 'rsp') return;
  const queries = p.query.split(';').map(s => s.trim()).filter(Boolean);
  if (!queries.length) { p.err = 'Bitte Suchbegriffe eingeben.'; drawRsp(); return; }
  const token = p.token = uid(); p.busy = true; p.err = null; p.detail = null; drawRsp();
  try {
    const res = await risMulti(queries, p.court, fresh);
    await widenRsp(res, queries, p.court, fresh);
    if (token === p.token) p.res = res;
  }
  catch (e) { if (token === p.token) { p.err = e.message; p.res = null; } }
  if (token !== p.token) return;
  p.busy = false; drawRsp();
}
async function suggestRsp() {
  const p = S.preview; const r = rowByKey(p.key); if (!r) return;
  p.busy = true; p.err = null; p.note = 'KI schlägt Suchbegriffe vor …'; drawRsp();
  try {
    const qs = await aiRspQueries(S.current, r);
    if (!qs.length) throw new Error('Die KI hat keine verwertbaren Suchbegriffe geliefert.');
    p.query = qs.join('; '); p.note = 'Suchbegriffe von der KI vorgeschlagen. Die Treffer stammen ausschließlich aus der amtlichen Datenbank.';
    await runRsp();
  } catch (e) { p.busy = false; p.note = ''; p.err = e.message; drawRsp(); }
}
async function togglePin(nr) {
  const p = S.preview; if (!p.key) return;
  const j = judgeOf(S.current, p.key); j.urteile = j.urteile || [];
  const i = j.urteile.findIndex(u => u.nr === nr);
  if (i >= 0) j.urteile.splice(i, 1);
  else {
    const h = (p.res && p.res.hits.find(x => x.nr === nr)) || p.detailHit; if (!h) return;
    j.urteile.push({ ...pinRecord(h), zeile: true });
  }
  await saveJudge(); renderMain(); drawRsp();
}

/* ========================= Reiter „Prüfung“: Prüfungsschema + einschlägige Rechtsprechung ========================= */
const SSTAT = { erfuellt: 'erfüllt', nicht_erfuellt: 'nicht erfüllt', offen: 'offen' };
function merkmalOf(a, r) { return r ? RULES[a.verfahren].groups.flatMap(g => g.merkmale).find(m => m.id === r.merkmal) || null : null; }
function pruefOf(a, r) { const m = merkmalOf(a, r); return (m && m.pruefung) || null; }
function stepJudge(key, sid) { const j = judgeOf(S.current, key); j.schritte = j.schritte || {}; return j.schritte[sid] || (j.schritte[sid] = {}); }
function stepState(a, key, sid) { const j = (a.judge || {})[key]; return (j && j.schritte && j.schritte[sid]) || {}; }
const pinnedAt = (u, sid) => sid === '*' ? isRowPin(u) : (u.schritte || []).includes(sid);
// Nicht analysierte optionale Gruppen: Zeilen ohne Vortrag, damit Prüfungsschema und Rechtsprechung trotzdem nutzbar sind
function virtualRows(a) {
  const have = new Set((a.analysis ? a.analysis.rows : []).map(r => r.gid));
  return RULES[a.verfahren].groups.filter(g => g.optional && !have.has(g.id)).flatMap(g => g.merkmale.map(m => ({
    key: g.id + '|' + m.id + '|', gid: g.id, merkmal: m.id, label: m.label, norm: m.norm, instanz: '', last: m.last, lastText: m.lastText || null, verify: !!m.verify,
    klaeger: [], beklagter: [], beweis: [], status: 'nicht_vorgetragen', begruendung: '', virtual: true })));
}
// Suchbegriffe: 1. kuratierte Begriffe am Prüfschritt, 2. konkreter Mangel + Leitbegriff, 3. ggf. KI-Vorschläge
function pruefQueries(a, r, step, extra) {
  const pr = pruefOf(a, r); const q = [];
  if (step) q.push(...(step.rsp || []));
  else if (pr) pr.schritte.forEach(s => { if (s.rsp && s.rsp[0]) q.push(s.rsp[0]); });
  const w = mangelWort(r);
  if (w) q.push(w + ' ' + ((step && step.leit) || (pr && pr.leit) || 'Mietminderung'));
  q.push(...(extra || []));
  if (!q.length) q.push(...rspQueries(a, r));
  return [...new Set(q)].slice(0, 6);
}
// Im Skript genanntes Aktenzeichen über die API verifizieren (nur exakte Übereinstimmung zählt)
async function risFileNumber(az, fresh) {
  const a = S.current; a.risCache = a.risCache || {};
  const key = 'az:' + az.toLowerCase();
  if (!fresh && a.risCache[key]) return { ...a.risCache[key], cached: true };
  const j = await risTry(path => risFetch(path, { fileNumber: az, size: 5 }));
  const n = s => String(s || '').replace(/\s+/g, '').toLowerCase();
  const hits = (j.member || []).map(m => normHit(m.item || m, m.textMatches)).filter(h => h.az.split(',').some(x => n(x) === n(az)));
  const res = { hits, at: new Date().toISOString() };
  a.risCache[key] = res; DB.put(a).catch(() => {});
  return res;
}
async function runPruefRsp(key, sid, fresh) {
  const a = S.current; const r = rowByKey(key); if (!r) return;
  const id = key + '#' + sid; const prev = S.pruefRsp[id] || {};
  const st = S.pruefRsp[id] = { ai: prev.ai || [], busy: true, note: prev.note || '' };
  refresh();
  const pr = pruefOf(a, r);
  const steps = pr ? (sid === '*' ? pr.schritte : pr.schritte.filter(s => s.id === sid)) : [];
  const queries = st.queries = pruefQueries(a, r, sid === '*' ? null : steps[0], st.ai);
  const azs = [...new Set(steps.flatMap(s => s.aktenzeichen || []))];
  const [res, az] = await Promise.all([
    risMulti(queries, '', fresh).then(x => widenRsp(x, queries, '', fresh)).catch(e => ({ err: e })),
    Promise.all(azs.map(z => risFileNumber(z, fresh).then(x => ({ az: z, hits: x.hits, cached: x.cached }), e => ({ az: z, err: e.message }))))
  ]);
  if (S.pruefRsp[id] !== st) return;
  st.busy = false; st.az = az;
  if (res.err) st.err = res.err.message; else st.res = res;
  refresh();
}
async function aiPruefRsp(key, sid) {
  const r = rowByKey(key); if (!r) return;
  const id = key + '#' + sid; const st = S.pruefRsp[id] = { ...(S.pruefRsp[id] || {}), busy: true, err: null, note: 'KI schlägt Suchbegriffe vor …' };
  refresh();
  try {
    const qs = await aiRspQueries(S.current, r);
    if (!qs.length) throw new Error('Die KI hat keine verwertbaren Suchbegriffe geliefert.');
    st.ai = qs; st.note = 'Ergänzt um KI-Suchbegriffe. Die Treffer stammen ausschließlich aus der amtlichen Datenbank.';
    await runPruefRsp(key, sid);
  } catch (e) { st.busy = false; st.note = ''; st.err = e.message; refresh(); }
}
// Alle Treffer einer Prüfschritt-Suche; Treffer zum Skript-Aktenzeichen zuerst
function pruefHits(st) {
  const skript = (st.az || []).flatMap(x => (x.hits || []).map(h => ({ ...h, skript: true })));
  const have = new Set(skript.map(h => h.nr));
  return [...skript, ...(st.res ? st.res.hits.filter(h => !have.has(h.nr)) : [])];
}
function findPruefHit(key, nr) {
  for (const [id, st] of Object.entries(S.pruefRsp)) if (id.startsWith(key + '#')) { const h = pruefHits(st).find(x => x.nr === nr); if (h) return h; }
  return null;
}
async function toggleStepPin(key, sid, nr) {
  const j = judgeOf(S.current, key); j.urteile = j.urteile || [];
  let u = j.urteile.find(x => x.nr === nr);
  if (u) { u.zeile = isRowPin(u); u.schritte = u.schritte || []; }
  if (u && pinnedAt(u, sid)) {
    if (sid === '*') u.zeile = false; else u.schritte = u.schritte.filter(x => x !== sid);
    if (!u.zeile && !u.schritte.length) j.urteile.splice(j.urteile.indexOf(u), 1);
  } else {
    if (!u) { const h = findPruefHit(key, nr); if (!h) return; u = { ...pinRecord(h), zeile: false, schritte: [] }; j.urteile.push(u); }
    if (sid === '*') u.zeile = true; else u.schritte.push(sid);
  }
  await saveJudge(); refresh(); if (S.preview && S.preview.kind === 'rsp') drawRsp();
}

    h += `<div class="pf-head"><div><span class="pf-lab">Obersatz</span>${esc(pr.obersatz)} ${srcHtml(pr.quelle)}</div>
      ${pr.definition ? `<div><span class="pf-lab">Definition</span>${esc(pr.definition)} ${srcHtml(pr.quelle)} ${verifyHtml(pr.verify)}</div>` : ''}</div>`;
    if (pr.statusHinweis && ['pauschal', 'bestritten', 'nichtwissen'].includes(st)) h += `<div class="banner warn" style="margin:8px 0 0">Hinweis zur Statusbewertung („${esc(STATUS[st].short)}“): ${esc(pr.statusHinweis)} ${srcHtml(pr.quelle)}</div>`;
    const ctx = [r.instanz, r.label, ...r.klaeger.map(i => i.kurz), ...r.beklagter.map(i => i.kurz)].join(' ');
    (pr.hinweise || []).filter(x => x.wenn.test(ctx)).forEach(x => { h += `<div class="banner info" style="margin:8px 0 0">ℹ ${esc(x.text)} ${srcHtml(x.quelle)}</div>`; });
    h += '<div class="pf-cols"><div class="pf-main"><div class="pf-sec">Prüfschritte</div><ol class="pf-steps">' + pr.schritte.map(s => {
      const ss = stepState(a, r.key, s.id); const val = ss.status || 'offen';
      return `<li class="pf-step pf-${val}">
        <div class="pf-step-top"><span class="pf-sid">${esc(s.id)}</span>
          <div class="pf-txt">${esc(s.text)}${s.hinweis ? `<div class="pf-hint">${esc(s.hinweis)}</div>` : ''}<div class="pf-meta">${srcHtml(s.quelle)}${verifyHtml(s.verify)}</div></div>
          <div class="pf-seg">${Object.entries(SSTAT).map(([v, l]) => `<button class="${val === v ? 'on s-' + v : ''}" data-sstat="${v}" data-pkey="${esc(r.key)}" data-sid="${esc(s.id)}">${l}</button>`).join('')}</div></div>
        <textarea class="note pf-note" data-snote="${esc(s.id)}" data-pkey="${esc(r.key)}" placeholder="Notiz zum Prüfschritt …">${esc(ss.note || '')}</textarea>
        ${pruefPinChips(a, r, s.id)}${rspBar(r, s.id, 'Einschlägige Rechtsprechung anzeigen')}${pruefRspHtml(r, s.id)}</li>`;
    }).join('') + '</ol>';
    if ((pr.streit || []).length) h += '<div class="pf-sec">Streitstände</div>' + pr.streit.map(x => `<div class="pf-streit"><b>${esc(x.frage)}</b><ul>${x.ansichten.map(v => `<li>${esc(v)}</li>`).join('')}</ul>${srcHtml(x.quelle)}</div>`).join('');
    h += '</div>';
  }
  if (!pr) h += '<div class="pf-cols">';
  const list = (arr, kind) => arr.length ? arr.map((it, i) => itemHtml(it, idx, kind, i)).join('') : '<span class="none">–</span>';
  h += `<div class="pf-side"><div class="pf-sec">Bezug zur Akte</div>
      ${r.virtual ? '<p class="small">Diese Gruppe wurde noch nicht analysiert.</p>' : `<div class="pf-lab">Kläger</div>${list(r.klaeger, 'klaeger')}<div class="pf-lab" style="margin-top:8px">Beklagter</div>${list(r.beklagter, 'beklagter')}`}
      <div class="pf-sec" style="margin-top:14px">Rechtsprechung zum ganzen Merkmal</div>

      <p class="small">Treffer nur aus der amtlichen Datenbank des Bundes. Geheftete Entscheidungen erscheinen im Begründungsgerüst.</p></div>`;
  return h + '</div></div>';
}

/* ========================= Begründungsgerüst (reine Struktur, keine KI-Würdigung) ========================= */
const zitierUrteil = u => `${u.gericht || 'Gericht'}, ${u.art || 'Entscheidung'} v. ${fmtDate(u.datum)} – ${u.az || u.nr}`;
function geruestHtml(a) {
  const rules = RULES[a.verfahren]; const judge = a.judge || {};
  const rows = [...a.analysis.rows, ...virtualRows(a).filter(v => judge[v.key])];
  const H = esc;
  let body = '';
  // Gliederung nach Anträgen; ein Merkmal, das mehrere Anträge betrifft, wird beim ersten ausgeführt
  const { kl } = antraegeOf(a);
  const parts = kl.map(ant => ({ titel: `Antrag ${ant.nr}: ${ant.kurz}${ant.hilfsweise ? ' (hilfsweise)' : ''}`, sub: [ant.def ? `${ant.def.titel} (${ant.def.norm})` : '', ant.anchor ? 'Fundstelle ' + ant.anchor : ''].filter(Boolean).join(' · '), rows: rows.filter(r => inAntrag(ant, r)) }));
  const rest = rows.filter(r => !parts.some(p => p.rows.includes(r)));
  if (rest.length) parts.push({ titel: 'Weitere Punkte', sub: '', rows: rest });
  const done = new Map();
  parts.forEach((part, pi) => {
    const L = String.fromCharCode(65 + pi);
    body += `<h2>${L}. ${H(part.titel)}</h2>${part.sub ? `<p class="muted">${H(part.sub)}</p>` : ''}`;
    for (const r of part.rows) {
      if (done.has(r.key)) { body += `<section><h3>${H(r.label)}${r.instanz ? ' – ' + H(r.instanz) : ''}</h3><p class="muted">Siehe oben unter ${done.get(r.key)}.</p></section>`; continue; }
      done.set(r.key, L);
        const j = judge[r.key] || {}; const pr = pruefOf(a, r); const st = effStatus(a, r);
        const pins = (j.urteile || []).filter(u => u.nr);
        body += `<section><h3>${H(r.label)}${r.instanz ? ' – ' + H(r.instanz) : ''}${r.norm ? ` <small>(${H(r.norm)})</small>` : ''}</h3>`;
        if (!j.checked) body += '<p class="tag">noch nicht geprüft</p>';
        body += pr ? `<p><b>Obersatz:</b> ${H(pr.obersatz)}</p>` : '<p class="muted">Kein Prüfungsschema hinterlegt.</p>';
        if (pr) body += '<ol>' + pr.schritte.map(s => {
          const ss = (j.schritte || {})[s.id] || {}; const sp = pins.filter(u => (u.schritte || []).includes(s.id));
          return `<li>${H(s.text)} – <b>${ss.status && ss.status !== 'offen' ? H(SSTAT[ss.status]) + ' (Gericht)' : 'offen'}</b>${ss.note ? `<div class="note">Notiz: ${H(ss.note)}</div>` : ''}${sp.length ? `<div class="rsp">Rspr.: ${sp.map(u => H(zitierUrteil(u))).join('; ')}</div>` : ''}</li>`;
        }).join('') + '</ol>';
        body += '<p class="ph">[… Würdigung durch das Gericht …]</p>';
        const facts = [...r.klaeger.map(i => ['Kläger', i]), ...r.beklagter.map(i => ['Beklagter', i])];
        const factLi = facts.map(([w, i]) => `<li>${w}: ${H(i.kurz)} <span class="anc">(${H(i.anchor)})</span></li>`).join('');
        if (facts.length) {
          if (STATUS[st].needsProof) body += `<h4>Streitig <small>(${H(STATUS[st].short)})</small></h4><ul>${factLi}</ul>` + (r.beweis.length ? `<p class="muted">Beweisangebote:</p><ul>${r.beweis.map(b => `<li>${b.partei === 'klaeger' ? 'Kläger' : 'Beklagter'}: ${H(MITTEL[b.mittel] || b.mittel)} – ${H(b.kurz)} <span class="anc">(${H(b.anchor)})</span></li>`).join('')}</ul>` : '');
          else if (st === 'offen') body += `<h4>Vortrag (Einlassung steht aus)</h4><ul>${factLi}</ul>`;
          else body += `<h4>Unstreitig <small>(${H(STATUS[st].short)})</small></h4><ul>${factLi}</ul>`;
        }
        const rowPins = pins.filter(isRowPin);
        if (rowPins.length) body += `<h4>Rechtsprechung</h4><ul>${rowPins.map(u => `<li>${H(zitierUrteil(u))}${u.titel ? ` <span class="muted">– ${H(u.titel)}</span>` : ''}</li>`).join('')}</ul>`;
        if (j.note) body += `<p class="note">Notiz des Gerichts: ${H(j.note)}</p>`;
        body += '</section>';
    }
  });
  return `<!doctype html><html lang="de"><head><meta charset="utf-8"><title>Begründungsgerüst ${H(a.az)}</title><style>
    body{font-family:Georgia,"Times New Roman",serif;max-width:820px;margin:30px auto;padding:0 20px;color:#1f2933;line-height:1.5}
    h1{font-size:20px;color:#00426f} h2{font-size:16px;color:#00426f;border-bottom:1px solid #d9e2ec;margin-top:28px} h3{font-size:14.5px;margin:18px 0 6px} h4{font-size:13px;margin:10px 0 4px}
    small,.muted{color:#5f6b7a} .tag{display:inline-block;font:600 11px Arial,sans-serif;color:#9a5b00;background:#fff4dc;border-radius:3px;padding:1px 6px;margin:0}
    .ph{font-style:italic;color:#5f6b7a;background:#f5f7fa;padding:6px 10px;border-left:3px solid #d9e2ec} .anc{font:11px monospace;color:#005f9f}
    .note{font-size:13px;color:#3e4c59} .rsp{font-size:13px;color:#4a2c94} .hint{font:12px Arial,sans-serif;color:#5f6b7a;background:#eef5fb;padding:8px 10px;border-radius:6px}
    .bar{margin-bottom:16px} .bar button{font:13px Arial,sans-serif;padding:6px 12px} @media print{.bar{display:none}} section{page-break-inside:avoid}
  </style></head><body><div class="bar"><button onclick="window.print()">Drucken</button></div>
  <h1>Begründungsgerüst – ${H(a.az)}</h1><p>${H(a.klaeger)} ./. ${H(a.beklagter)} · ${H(rules.label)} · Stand ${H(new Date().toLocaleString('de-DE'))} · erstellt mit BGH Pro Max</p>
  <p class="hint">Reine Gliederung entlang des Regelmodells. Obersätze und Hinweise sind Vorschläge im Konjunktiv; Status der Prüfschritte wie vom Gericht gesetzt. Zitiert werden nur angeheftete Entscheidungen aus der amtlichen Datenbank des Bundes. Die Würdigung nimmt das Gericht vor.</p>
  ${body}</body></html>`;
}

/* ========================= Abgeleitete Werte ========================= */
function sideOf(akte, last) {
  if (!last || last === 'gestuft') return null;
  const r = RULES[akte.verfahren];
  return (last === 'mieter') === (r.klaegerRolle === 'Mieter') ? 'klaeger' : 'beklagter';
}
function judgeOf(akte, key) { akte.judge = akte.judge || {}; return akte.judge[key] || (akte.judge[key] = {}); }
function effStatus(akte, r) { const j = (akte.judge || {})[r.key]; return (j && j.status) || r.status; }
function needsProof(akte, r) { return STATUS[effStatus(akte, r)].needsProof; }
function proofGap(akte, r) {
  const side = sideOf(akte, r.last); if (!side || !needsProof(akte, r)) return null;
  return r.beweis.some(b => b.partei === side) ? null : side;
}
function partyName(akte, side) {
  const r = RULES[akte.verfahren];
  return side === 'klaeger' ? `Kläger (${r.klaegerRolle})` : `Beklagter (${r.beklagterRolle})`;
}

// Unstreitige und nicht bestrittene Merkmale sind in der Gesamttabelle standardmäßig eingeklappt

/* ========================= Übersicht nach Klageanträgen ========================= */
const inAntrag = (ant, r) => r.merkmal !== 'SONST' && (ant.merkmale === null || ant.merkmale.includes(r.merkmal));
// Anträge der Akte; ohne erfasste Anträge (ältere Analysen, Fehler) aus dem Regelmodell abgeleitet
function antraegeOf(a) {
  const defs = ANTRAEGE[a.verfahren] || [];
  const rows = a.analysis ? a.analysis.rows : [];
  const src = (a.analysis && a.analysis.antraege) || [];
  let kl = src.filter(x => x.partei === 'klaeger').map(x => ({ ...x, def: defs.find(d => d.typ === x.typ) || null }));
  const bk = src.filter(x => x.partei === 'beklagter');
  if (!kl.length) {
    const vortrag = id => rows.some(r => r.merkmal === id && (r.klaeger.length || r.beklagter.length));
    kl = defs.filter(d => d.kenn && vortrag(d.kenn)).map(d => ({ typ: d.typ, kurz: d.titel, def: d, abgeleitet: true }));
    if (!kl.length && defs.length && rows.length) kl = [{ typ: defs[0].typ, kurz: defs[0].titel, def: defs[0], abgeleitet: true }];
    kl.forEach((x, i) => { x.nr = String(i + 1); });
  }
  kl.sort((x, y) => (parseInt(x.nr, 10) || 99) - (parseInt(y.nr, 10) || 99));
  return { kl: kl.map((x, i) => ({ ...x, id: 'A' + i, merkmale: x.def ? x.def.merkmale : [] })), bk };
}

function wrapRanges(textNodes, ranges) {

}

  if (!quote) return null;
  const nodes = textNodesIn(body.querySelector('.md-doc'), '.lan, h2, .fm');
  const hit = findQuote(nodes.map(n => ({ text: n.data })), quote, true);

async function drawPdf(d, body, quote, alive) {

  const textNodes = [], ocrPages = [];

    if (!alive()) return null;

    const c = document.createElement('canvas'); const dpr = window.devicePixelRatio || 1;
    c.width = Math.floor(vp.width * dpr); c.height = Math.floor(vp.height * dpr); c.style.width = vp.width + 'px'; c.style.height = vp.height + 'px';

  }

    const { canvas } = await renderPdfPageToCanvas(pdf, op.p, 2);
    const r = await ocr(canvas, 'pdf|' + d.variants.pdf.sig + '|' + op.p);
    note.textContent = `Seite ${op.p} ist ein Scan – Markierung per Texterkennung.`;

function overlayOcr(wrap, r, w, h, quote) {
  const hit = findQuote(r.words.map(x => ({ text: x.text })), quote, true);

async function loadExample() {
  if (location.protocol === 'file:') { S.error = 'Die Beispielakte gibt es nur in der Online-Version. Lokal bitte „Neue Akte“ anlegen und z. B. den Ordner Challenge_03_Fall_01_Westring wählen.'; render(); return; }
  setBusy('Beispielakte wird geladen …');
  try {
    const base = new URL('beispiel/', document.baseURI);
    const list = await (await fetch(new URL('manifest.json', base))).json();
    const entries = [];
    for (const p of list) { const r = await fetch(new URL(p.split('/').map(encodeURIComponent).join('/'), base)); entries.push({ path: p.replace(/^westring\//, ''), file: new File([await r.blob()], p.split('/').pop(), { lastModified: 1 }) }); }
    const analysis = await (await fetch(new URL('analyse.json', base))).json();
    const akte = { id: 'beispiel-westring', az: 'SYN-C3-WEST-26', klaeger: 'Mira Fink', beklagter: 'Erik Weber', verfahren: 'minderung', folderName: 'Beispiel Westring', created: new Date().toISOString(), judge: {}, analysis, example: true };
    memFiles.set(akte.id, entries); await DB.filesPut(akte.id, entries).catch(() => {});
    await DB.put(akte); S.akten = S.akten.filter(a => a.id !== akte.id); S.akten.unshift(akte);
    S.busy = null; await selectAkte(akte.id);
  } catch (e) { S.busy = null; S.error = 'Beispielakte konnte nicht geladen werden: ' + e.message; render(); }
}

/* ========================= Ereignisse ========================= */
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (S.menu) { S.menu = false; renderMain(); } else if (S.preview) closePreview();
});
document.addEventListener('click', async e => {
  // Menü schließt sich bei jedem Klick außerhalb
  if (S.menu && !e.target.closest('.menu, #btnMenu')) { S.menu = false; renderMain(); }
  const t = e.target.closest('button, [data-akte]'); if (!t) return;
  if (t.id === 'btnMenu') { S.menu = !S.menu; renderMain(); return; }
  if (t.closest('.menu')) { S.menu = false; renderMain(); }
  if (t.id === 'btnNew') { S.newForm = S.newForm ? null : { az: '', kl: '', bk: '', vf: 'auto' }; S.pendingFolder = null; renderSide(); return; }
  if (t.id === 'nfCancel') { S.newForm = null; S.pendingFolder = null; renderSide(); return; }
  if (t.id === 'nfFolder') {
    const f = S.newForm; f.az = $('#nfAz').value; f.kl = $('#nfKl').value; f.bk = $('#nfBk').value; f.vf = $('#nfVf').value;
    try { const pf = await pickFolder('folder'); if (pf) { S.pendingFolder = pf; S.formMsg = null; } } catch (err) { S.formMsg = 'Ordner konnte nicht geöffnet werden: ' + err.message; }
    renderSide(); return;
  }
  if (t.id === 'nfFiles') {
    const f = S.newForm; f.az = $('#nfAz').value; f.kl = $('#nfKl').value; f.bk = $('#nfBk').value; f.vf = $('#nfVf').value;
    try { const pf = await pickFolder('files'); if (pf) { S.pendingFolder = pf; S.formMsg = null; } } catch (err) { S.formMsg = err.message; }
    renderSide(); return;
  }
  if (t.id === 'btnExample') { await loadExample(); return; }
  if (t.id === 'nfCreate') { await createAkte(); return; }
  if (t.dataset.akte) { await selectAkte(t.dataset.akte); return; }
  if (t.id === 'btnSettings') { openSettings(); return; }
  if (t.id === 'btnAnalyze') { await analyze(); return; }
  if (t.id === 'btnRescan') { await rescan(); return; }
  if (t.id === 'btnReconnect') { await reconnect(); return; }
  if (t.id === 'btnDocs') { S.showDocs = !S.showDocs; renderMain(); return; }
  if (t.id === 'btnExport') { await exportAkte(); return; }
  if (t.id === 'btnImport') { importAkte(); return; }
  if (t.id === 'btnVerfahren') { const a = S.current; a.verfahren = a.verfahren === 'raeumung' ? 'minderung' : 'raeumung'; a.verfahrenManual = true; await DB.put(a); S.notice = 'Verfahrensart umgestellt auf: ' + RULES[a.verfahren].label + '. Bitte neu analysieren.'; renderMain(); return; }
  if (t.id === 'btnDelete') { S.confirmDelete = true; renderMain(); return; }
  if (t.id === 'btnDeleteNo') { S.confirmDelete = false; renderMain(); return; }
  if (t.id === 'btnDeleteYes') {
    S.confirmDelete = false; await DB.del(S.current.id); await DB.filesDel(S.current.id).catch(() => {}); memFiles.delete(S.current.id);
    S.akten = S.akten.filter(a => a !== S.current); S.current = null; S.docs = null; S.preview = null; render(); return;
  }
  if (t.dataset.filter) {
    S.filter = t.dataset.filter;
    if (S.filter !== 'alle') S.openAntrag = new Set([...antraegeOf(S.current).kl.map(x => x.id), 'REST', 'SONST']);
    renderMain(); return;
  }
  if (t.dataset.ref) {
    const [ri, kind, i] = t.dataset.ref.split('|'); const r = shownRows(S.current)[+ri];
    const it = (kind === 'beweis' ? r.beweis : r[kind])[+i];
    const ziel = kind === 'beweis' ? proofTarget(it) : null;
    const back = S.preview && S.preview.kind === 'pruef' ? S.preview.key : null;
    if (ziel) { await openPreview(ziel, null, t.dataset.ref, null, { dok: it.dok, zitat: it.zitat, anchor: it.anchor }, back); return; }
    await openPreview(it.dok, it.zitat, t.dataset.ref, it.anchor, null, back); return;
  }
  if (t.dataset.doc) { await openPreview(t.dataset.doc, null, null, null); return; }
  if (t.dataset.via) { const v = S.preview.via; await openPreview(v.dok, v.zitat, S.preview.ref, v.anchor, null, S.preview.back); return; }
  if (t.dataset.fmt) { S.preview.fmt = t.dataset.fmt; await drawPreview(); return; }
  if (t.id === 'btnGeruest') { openGeruest(); return; }
  if (t.id === 'gCancel') { $('#modalRoot').innerHTML = ''; return; }
  if (t.id === 'gSave') { saveGeruest(); $('#modalRoot').innerHTML = ''; return; }
  if (t.id === 'gPrint') { printGeruest(); $('#modalRoot').innerHTML = ''; return; }
  if (t.dataset.antrag) {
    const k = t.dataset.antrag; S.openAntrag.has(k) ? S.openAntrag.delete(k) : S.openAntrag.add(k); renderMain();
    const el = S.openAntrag.has(k) && document.getElementById('ap-' + k); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    return;
  }
  if (t.dataset.fold) { const r = shownRows(S.current).find(x => x.key === t.dataset.fold); if (r) S.fold.set(r.key, !isFolded(S.current, r)); renderMain(); return; }
  if (t.id === 'btnUnfoldAll' || t.id === 'btnFoldAll') { S.fold = new Map(shownRows(S.current).map(r => [r.key, t.id === 'btnFoldAll'])); renderMain(); return; }
  if (t.id === 'btnFoldReset') { S.fold = new Map(); renderMain(); return; }
  if (t.dataset.mrow) { const k = t.dataset.mrow; S.openRow.has(k) ? S.openRow.delete(k) : S.openRow.add(k); renderMain(); return; }
  if (t.id === 'btnAntAll' || t.id === 'btnAntNone') { S.openAntrag = new Set(t.id === 'btnAntAll' ? [...antraegeOf(S.current).kl.map(x => x.id), 'REST', 'SONST', ...RULES[S.current.verfahren].groups.filter(g => g.optional).map(g => 'OPT:' + g.id)] : []); if (t.id === 'btnAntNone') S.openRow = new Set(); renderMain(); return; }
  if (t.dataset.view) { S.viewTable = t.dataset.view === 'tabelle'; renderMain(); return; }
  if (t.dataset.antref) {
    const [side, i] = t.dataset.antref.split(':'); const x = antraegeOf(S.current)[side][+i];
    if (x) await openPreview(x.dok, x.zitat, null, x.anchor); return;
  }
  if (t.dataset.pruefopen) { showPruef(t.dataset.pruefopen); return; }
  if (t.dataset.sstat) { stepJudge(t.dataset.pkey, t.dataset.sid).status = t.dataset.sstat; await saveJudge(); refresh(); return; }
  if (t.dataset.srsp) { await runPruefRsp(t.dataset.pkey, t.dataset.srsp); return; }
  if (t.dataset.srspfresh) { await runPruefRsp(t.dataset.pkey, t.dataset.srspfresh, true); return; }
  if (t.dataset.srspai) { await aiPruefRsp(t.dataset.pkey, t.dataset.srspai); return; }
  if (t.dataset.spin) { await toggleStepPin(t.dataset.pkey, t.dataset.sid, t.dataset.spin); return; }
  if (t.dataset.rspseed) {
    // Volltext / alle Treffer aus dem Reiter „Prüfung“ im bestehenden Seitenpanel öffnen
    const st = S.pruefRsp[t.dataset.rspkey + '#' + t.dataset.rspseed] || {};
    const hits = pruefHits(st);
    const back = S.preview && S.preview.kind === 'pruef' ? S.preview.key : null;
    openRsp(t.dataset.rspkey, t.dataset.rspopen || null, { query: (st.queries || []).join('; '), res: { hits, perQuery: st.res ? st.res.perQuery : [], cached: true } }, back);
    return;
  }
  if (t.id === 'btnRsp') { openRsp(null); return; }
  if (t.dataset.rsp) { openRsp(t.dataset.rsp); return; }
  if (t.dataset.minest) { await runMinderung(t.dataset.minest); return; }
  if (t.dataset.minopen) {
    const est = (S.current.minderung || {})[t.dataset.minopen] || { urteile: [], queries: [] };
    const hits = est.urteile.map(u => ({ ...u, treffer: [{ name: 'Minderungsquote ' + u.quote + ' %', text: u.zitat }], queries: [], score: 0 }));
    openRsp(t.dataset.minopen, t.dataset.nr, { query: est.queries.join('; '), res: { hits, perQuery: [], cached: true } }); return;
  }
  if (t.dataset.rspopen) {
    if (t.dataset.rspkey && !(S.preview && S.preview.kind === 'rsp' && S.preview.key === t.dataset.rspkey)) { openRsp(t.dataset.rspkey, t.dataset.rspopen, null, S.preview && S.preview.kind === 'pruef' ? S.preview.key : null); return; }
    S.preview.detail = t.dataset.rspopen; drawRsp(); return;
  }
  if (t.dataset.rsppin) { await togglePin(t.dataset.rsppin); return; }
  if (t.id === 'rspBack') { S.preview.detail = null; drawRsp(); if (!S.preview.res && S.preview.query) runRsp(); return; }
  if (t.id === 'rspGo') { S.preview.query = $('#rspQ').value; S.preview.court = $('#rspCourt').value; await runRsp(); return; }
  if (t.id === 'rspFresh') { await runRsp(true); return; }
  if (t.id === 'rspAi') { await suggestRsp(); return; }
  if (t.id === 'btnShowSide' || t.id === 'pvClose') { closePreview(); return; }
  if (t.dataset.notebtn) { const k = t.dataset.notebtn; S.openNotes.has(k) ? S.openNotes.delete(k) : S.openNotes.add(k); renderMain(); return; }
});
document.addEventListener('change', async e => {
  const t = e.target;
  if (t.id === 'rspCourt' && S.preview) { S.preview.court = t.value; if (S.preview.query) runRsp(); return; }
  if (t.dataset.optgroup) {
    const a = S.current; const g = t.dataset.optgroup; a.optGroups = (a.optGroups || []).filter(x => x !== g);
    if (t.checked) a.optGroups.push(g);
    await DB.put(a); return;
  }
  if (t.dataset.check) { judgeOf(S.current, t.dataset.check).checked = t.checked; await saveJudge(); refresh(); }
  if (t.dataset.status !== undefined && t.matches('select[data-status]')) { judgeOf(S.current, t.dataset.status).status = t.value || null; await saveJudge(); refresh(); }
  if (t.matches('select[data-side]')) { const a = S.current; a.docSides = a.docSides || {}; if (t.value) a.docSides[t.dataset.side] = t.value; else delete a.docSides[t.dataset.side]; await DB.put(a); S.notice = 'Rolle geändert – bitte neu analysieren.'; renderMain(); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'rspQ' && !S.preview.busy) { S.preview.query = e.target.value; S.preview.court = $('#rspCourt').value; runRsp(); }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'rspQ' && S.preview) { S.preview.query = t.value; return; }
  if (t.dataset.note) { judgeOf(S.current, t.dataset.note).note = t.value; clearTimeout(t._tm); t._tm = setTimeout(() => DB.put(S.current), 400); }
  if (t.dataset.snote) { stepJudge(t.dataset.pkey, t.dataset.snote).note = t.value; clearTimeout(t._tm); t._tm = setTimeout(() => DB.put(S.current), 400); }
});

/* ========================= Start ========================= */
(async function init() {
  await DB.open();
  S.akten = (await DB.all()).sort((a, b) => (b.created || '').localeCompare(a.created || ''));
  render();
  if (S.akten[0]) await selectAkte(S.akten[0].id);
  else if (location.protocol !== 'file:' && lsGet('t9_example_loaded') !== '1') { lsSet('t9_example_loaded', '1'); await loadExample(); }
})();

// Testschnittstelle (nur für automatisierte Tests)
window.__T9 = { S, RULES, callLLM, analyze, openSettings, loadExample, findQuote, buildDocs, runAnalysis, openPreview, render, DB, memFiles, selectAkte, lsSet,
  PRUEFUNG, pruefQueries, runPruefRsp, risFileNumber, toggleStepPin, virtualRows, geruestHtml };
</script>
